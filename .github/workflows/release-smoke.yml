name: Verify published Axis APK

on:
  push:
    paths:
      - '.github/workflows/release-smoke.yml'
      - 'scripts/smoke_release.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - name: Download signed APK
        run: |
          curl --fail --location --retry 3 --output Axis-0.1.0.apk https://github.com/kittkanev/Axis/releases/download/v0.1.0/Axis-0.1.0.apk
          echo '5b05258d92f4d1752048636597eb302296bc4c39a483479909ca0e2561a7e633  Axis-0.1.0.apk' | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 scripts/smoke_release.py Axis-0.1.0.apk
