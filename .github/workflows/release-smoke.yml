name: Verify published Axis APK

on:
  push:
    paths:
      - '.github/workflows/release-smoke.yml'
      - 'scripts/smoke_*.py'
      - 'scripts/smoke_android.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    env:
      AXIS_SMOKE_PACKAGE: io.github.kittkanev.axis.preview050
      AXIS_APK: Axis-0.5.0-preview.apk
    steps:
      - uses: actions/checkout@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: build-tools;35.0.0
      - name: Download signed APK
        run: |
          curl --fail --location --retry 3 --output "$AXIS_APK" \
            "https://github.com/kittkanev/Axis/releases/download/v0.5.0-preview/$AXIS_APK"
          printf '%s  %s\n' b5a1325d355b2abe7173d8a20c26636488ef410f7f1cdda55032ac572875ec98 "$AXIS_APK" | sha256sum --check
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$AXIS_APK"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash scripts/smoke_android.sh "$AXIS_APK"
